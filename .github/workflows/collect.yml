name: Compliance-safe collection
on:
  schedule: [{cron: "23 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: collectors, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run independently isolated collectors
        run: npm run collect
        env:
          SPREA_INGEST_URL: ${{ secrets.SPREA_INGEST_URL }}
          SPREA_INGEST_TOKEN: ${{ secrets.SPREA_INGEST_TOKEN }}
